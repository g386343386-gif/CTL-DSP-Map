<style>
:root {
  --bg:#f6f7fb; --panel:#fff; --text:#172033; --muted:#667085; --line:#e5e7eb;
}
* { box-sizing:border-box; }
body { margin:0; font-family:Inter,Segoe UI,Arial,"Microsoft YaHei",sans-serif; color:var(--text); background:var(--bg); }
header { background:#fff; border-bottom:1px solid var(--line); padding:16px 20px; }
h1 { margin:0 0 5px; font-size:22px; }
.sub { color:var(--muted); font-size:13px; }
.layout { display:grid; grid-template-columns:300px 1fr; min-height:calc(100vh - 75px); }
aside { background:#fff; border-right:1px solid var(--line); padding:16px; overflow:auto; }
#map { min-height:720px; height:calc(100vh - 75px); }
.section-title { font-weight:700; margin:4px 0 10px; }
.dsp-btn { width:100%; display:flex; align-items:center; gap:9px; padding:10px 9px; margin:5px 0;
 border:1px solid var(--line); background:#fff; border-radius:9px; cursor:pointer; text-align:left; }
.dsp-btn:hover,.dsp-btn.active { background:#f2f4f7; border-color:#98a2b3; }
.dot { width:13px;height:13px;border-radius:50%; flex:0 0 auto; }
.controls { display:flex; gap:7px; margin:10px 0 16px; }
.controls button { flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px; cursor:pointer; }
.legend-note { color:var(--muted); font-size:12px; line-height:1.45; margin-top:14px; }
.route-label {
  background:rgba(255,255,255,.92); border:1px solid #344054; color:#101828;
  font-weight:800; border-radius:5px; padding:1px 4px; box-shadow:none; white-space:nowrap;
}
.route-label:before { display:none; }
.info { padding:10px 12px; min-width:220px; line-height:1.45; }
.info b { font-size:14px; }
.status { margin-top:14px; padding:10px; border-radius:8px; background:#f8fafc; color:#475467; font-size:12px; }
.search { width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:10px; }
@media(max-width:760px) {
  .layout { grid-template-columns:1fr; }
  aside { border-right:0; border-bottom:1px solid var(--line); }
  #map { height:70vh; min-height:520px; }
}
</style>
</head>
<body>
<header>

</header>
<div class="layout">
<aside>

  </div>
</aside>
<div id="map"></div>
</div>

const allZips = ["28012", "28016", "28021", "28023", "28025", "28027", "28031", "28032", "28034", "28036", "28037", "28052", "28054", "28056", "28075", "28078", "28079", "28080", "28081", "28083", "28086", "28088", "28092", "28098", "28101", "28104", "28105", "28110", "28112", "28115", "28117", "28120", "28134", "28144", "28146", "28147", "28150", "28152", "28164", "28166", "28173", "28203", "28204", "28205", "28206", "28207", "28208", "28209", "28210", "28211", "28212", "28213", "28214", "28215", "28216", "28217", "28226", "28227", "28262", "28269", "28270", "28273", "28277", "28278", "28625", "28677", "29707", "29708", "29710", "29715", "29720", "29730", "29732", "29745"];
const dsps = ["ATL-CTL-G1", "ATL-CTL-LIOQ", "ATL-CTL-MJXY", "ATL-CTL-OSHI", "ATL-CTL-PFC", "ATL-CTL-ROBUST"];
const palette = ["#2563eb","#dc2626","#16a34a","#9333ea","#ea580c","#0891b2","#be123c","#4f46e5"];
const colors = Object.fromEntries(dsps.map((d,i)=>[d,palette[i%palette.length]]));
const byZip = {};
records.forEach(r => { if(!byZip[r.zip]) byZip[r.zip]=[]; byZip[r.zip].push(r); });

const map = L.map("map", {zoomControl:true}).setView([35.15,-80.84], 8);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

let geoLayer = null;
let selectedDSP = null;
let allBounds = null;
let featuresCache = [];
const statusEl = document.getElementById("status");

function recForZip(zip, dsp=null) {
  const a = byZip[zip] || [];
  return dsp ? a.find(x=>x.dsp===dsp) : a[0];
}
function matchingRecords(zip) {
  return (byZip[zip]||[]).filter(r => !selectedDSP || r.dsp===selectedDSP);
}
function featureStyle(feature) {
  const zip = feature.properties.ZCTA5 || feature.properties.GEOID || feature.properties.BASENAME;
  const rs = matchingRecords(zip);
  if(!rs.length) return {color:"#94a3b8",weight:1,fillOpacity:0};
  const c = colors[rs[0].dsp];
  return {color:c,weight:2,fillColor:c,fillOpacity:.27};
}
function popupHtml(zip) {
  const rs = matchingRecords(zip);
  if(!rs.length) return `<div class="info"><b>ZIP ${zip}</b></div>`;
  return rs.map(r => `<div class="info">
    <b>${r.route} · ZIP ${r.zip}</b><br>
    DSP: ${r.dsp}<br>
    Sorting Code: ${r.sorting}<br>
    City: ${r.city}<br>
    Difficulty: ${r.difficulty}<br>
    <span style="color:#667085">${r.reason}</span>
  </div>`).join("<hr>");
}
function labelFor(zip) {
  const rs = matchingRecords(zip);
  if(!rs.length) return "";
  const routes = [...new Set(rs.map(r=>r.route))];
  return routes.join("/");
}
function render() {
  if(geoLayer) map.removeLayer(geoLayer);
  const visible = {type:"FeatureCollection",features:featuresCache.filter(f => {
    const zip=f.properties.ZCTA5 || f.properties.GEOID || f.properties.BASENAME;
    return matchingRecords(zip).length>0;
  })};
  geoLayer = L.geoJSON(visible, {
    style: featureStyle,
    onEachFeature: (feature, layer) => {
      const zip=feature.properties.ZCTA5 || feature.properties.GEOID || feature.properties.BASENAME;
      layer.bindPopup(popupHtml(zip));
      const label=labelFor(zip);
      if(label) layer.bindTooltip(label, {permanent:true,direction:"center",className:"route-label"});
    }
  }).addTo(map);
  if(geoLayer.getLayers().length) {
    const b=geoLayer.getBounds(); if(b.isValid()) map.fitBounds(b.pad(.04));
  }
  document.querySelectorAll(".dsp-btn").forEach(b=>b.classList.toggle("active", b.dataset.dsp===selectedDSP));
}
function buildDSPList() {
  const box=document.getElementById("dspList");
  dsps.forEach(d=>{
    const count=new Set(records.filter(r=>r.dsp===d).map(r=>r.zip)).size;
    const b=document.createElement("button"); b.className="dsp-btn"; b.dataset.dsp=d;
    b.innerHTML=`<span class="dot" style="background:${colors[d]}"></span><span><b>${d}</b><br><small>${count} ZIP areas</small></span>`;
    b.addEventListener("click",()=>{selectedDSP=(selectedDSP===d?null:d); render();});
    box.appendChild(b);
  });
}
buildDSPList();
document.getElementById("showAll").onclick=()=>{selectedDSP=null; render();};
document.getElementById("fitAll").onclick=()=>{selectedDSP=null; render();};
document.getElementById("search").addEventListener("input", e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q) return;
  const r=records.find(x=>x.zip.toLowerCase().includes(q)||x.route.toLowerCase().includes(q)||x.dsp.toLowerCase().includes(q));
  if(!r) return;
  selectedDSP=r.dsp; render();
  setTimeout(()=>{
    geoLayer.eachLayer(layer=>{
      const z=layer.feature.properties.ZCTA5 || layer.feature.properties.GEOID || layer.feature.properties.BASENAME;
      if(z===r.zip) { map.fitBounds(layer.getBounds().pad(.3)); layer.openPopup(); }
    });
  },100);
});

async function loadBoundaries() {
  try {
    const chunks=[];
    for(let i=0;i<allZips.length;i+=35) chunks.push(allZips.slice(i,i+35));
    let feats=[];
    for(const chunk of chunks) {
      const where = "ZCTA5 IN (" + chunk.map(z=>"'"+z+"'").join(",") + ")";
      const p = new URLSearchParams({
        where, outFields:"ZCTA5,GEOID,NAME,CENTLAT,CENTLON",
        returnGeometry:"true", outSR:"4326", f:"geojson"
      });
      const u="https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/PUMA_TAD_TAZ_UGA_ZCTA/MapServer/1/query?"+p;
      const resp=await fetch(u);
      if(!resp.ok) throw new Error("Census request failed");
      const gj=await resp.json();
      feats=feats.concat(gj.features||[]);
    }
    featuresCache=feats;
    const got=new Set(feats.map(f=>f.properties.ZCTA5 || f.properties.GEOID));
    const missing=allZips.filter(z=>!got.has(z));
    statusEl.textContent=`已加载 ${feats.length} 个 ZIP/ZCTA 边界` + (missing.length?`；${missing.length} 个 ZIP 无 ZCTA 边界：${missing.join(", ")}`:"。");
    render();
  } catch(err) {
    statusEl.innerHTML="ZIP 边界加载失败。请确认网络可访问 Census TIGERweb；表格数据仍已嵌入网页。<br>"+err.message;
  }
}
loadBoundaries();
